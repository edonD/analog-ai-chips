<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpiceGlass — .asc editor</title>
<style>
  :root{ --bg:#23262b; --panel:#16181c; --ink:#dde1e8; --line:#1b1b1b;
         --accent:#3d7ad6; --warn:#caa23a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:"Segoe UI",Arial,sans-serif;
             background:var(--bg); color:var(--ink); overflow:hidden; }
  #bar{ display:flex; align-items:center; gap:10px; padding:6px 10px;
        background:#2b2f36; border-bottom:1px solid #11131699; font-size:13px; }
  #bar b{ font-weight:600; }
  #bar .sp{ flex:1; }
  button{ background:#3d434d; color:var(--ink); border:0; border-radius:5px;
          padding:5px 10px; font-size:12px; cursor:pointer; }
  button:hover{ background:#4a515d; }
  #status{ font-size:12px; color:#9fb6a3; min-width:120px; text-align:right; }
  #files{ background:#16181c; color:#d8dee7; border:1px solid #3a3f48;
          border-radius:5px; padding:4px 6px; font-size:12px; max-width:340px; }
  #palette{ background:#3d434d; color:var(--ink); border:0; border-radius:5px;
            padding:5px 8px; font-size:12px; }
  #srcnote{ font-size:11px; color:#caa23a; }
  #crumb{ font-size:12px; color:#9fb6a3; }
  #crumb a{ color:#6fa8dc; text-decoration:none; }
  #crumb a:hover{ text-decoration:underline; }
  #crumb b{ color:#cfe3d4; }
  #wrap{ display:flex; height:calc(100% - 37px); }
  #left{ width:42%; min-width:240px; display:flex; flex-direction:column;
         border-right:1px solid #11131699; }
  #ta{ flex:1; width:100%; resize:none; border:0; outline:none;
       background:var(--panel); color:#d8dee7; padding:10px 12px;
       font:13px/1.45 Consolas,"Cascadia Mono",monospace; tab-size:4;
       white-space:pre; overflow:auto; }
  #right{ flex:1; position:relative; background:#fbfcfe; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block;
       cursor:crosshair; touch-action:none; outline:none; }
  #hud{ position:absolute; right:10px; bottom:8px; font-size:11px;
        color:#5b6675; background:#ffffffd0; border:1px solid #e2e6ec;
        padding:2px 8px; border-radius:4px; pointer-events:none;
        font-family:Consolas,"Cascadia Mono",monospace; }
  #hint{ position:absolute; left:10px; bottom:8px; font-size:11px;
         color:#7a8290; background:#ffffffcc; padding:2px 7px;
         border-radius:4px; pointer-events:none; }
  #warns{ position:absolute; left:10px; top:8px; max-width:46%;
          font-size:11px; color:#7a5; }
  #warns div{ background:#fff8e6; color:#7a5a10; border:1px solid #e7d28a;
              border-radius:4px; padding:2px 7px; margin-bottom:3px; }
  #drc{ position:absolute; right:8px; top:8px; width:300px; max-width:46%;
        max-height:70%; overflow:auto; font-size:11px;
        box-shadow:0 2px 10px #0003; border-radius:6px; display:none; }
  #drc .hd{ background:#23262b; color:#dde1e8; padding:5px 9px;
            border-radius:6px 6px 0 0; font-weight:600; display:flex; }
  #drc .hd .x{ margin-left:auto; cursor:pointer; opacity:.7; }
  #drc .it{ background:#fff; border:1px solid #e6c9c9; border-top:0;
            color:#a23; padding:4px 9px; cursor:pointer; }
  #drc .it:hover{ background:#fff2f2; }
  #drc .it b{ color:#7a1520; }
  #drc .ok{ background:#eef8ee; color:#2a7a45; border:1px solid #bfe3bf;
            border-radius:0 0 6px 6px; padding:5px 9px; }
  .drag{ width:5px; cursor:col-resize; background:#0d0e10; }
</style>
</head>
<body>
<div id="bar">
  <b>SpiceGlass</b>
  <select id="files" title="open a file from the repo"></select>
  <button id="upload">Upload…</button>
  <input id="fileinput" type="file" accept=".asc,.cir,.spice,.sp,.plan" hidden>
  <span id="srcnote"></span>
  <span id="crumb" title="hierarchy path — double-click a block to descend, Esc to go up"></span>
  <span class="sp"></span>
  <select id="palette" title="place a component (click on canvas; R rotates)">
    <option value="">+ Component ▾</option>
    <option value="res">Resistor</option>
    <option value="cap">Capacitor</option>
    <option value="ind">Inductor</option>
    <option value="diode">Diode</option>
    <option value="nmos">NMOS</option>
    <option value="pmos">PMOS</option>
    <option value="npn">NPN</option>
    <option value="pnp">PNP</option>
    <option value="voltage">Voltage src</option>
    <option value="current">Current src</option>
    <option value="opamp">Op-amp</option>
    <option value="gnd">GND</option>
    <option value="label">Net label…</option>
  </select>
  <button id="importbtn" title="import a KiCad .kicad_sym or xschem .sym library">Import lib…</button>
  <input id="libinput" type="file" accept=".kicad_sym,.sym" hidden>
  <button id="wirebtn" title="draw wires (W) — click to place, dbl-click to end">+ Wire</button>
  <button id="undobtn" title="undo (Ctrl-Z)">↶</button>
  <button id="redobtn" title="redo (Ctrl-Y)">↷</button>
  <button id="delbtn" title="delete selected (Del)">Delete</button>
  <button id="checkbtn" title="check the schematic (DRC)">✓ Check</button>
  <a href="/symbols" target="_blank" style="color:#9fb6a3;font-size:12px;
     text-decoration:none;margin:0 6px">Symbols ↗</a>
  <button id="fit">Fit ⤢</button>
  <button id="save">Save (Ctrl-S)</button>
  <span id="status">ready</span>
</div>
<div id="wrap">
  <div id="left"><textarea id="ta" spellcheck="false" wrap="off"></textarea></div>
  <div class="drag" id="dragbar"></div>
  <div id="right">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="hint">drag · Shift+click / Shift+drag = multi-select · Space/R rotate · dbl-click edit · dbl-click a block = open it · Esc = up a level · Ctrl+click = highlight net (toggle) · Ctrl-D duplicate · W+drag wire · Del delete · Ctrl-Z undo</div>
    <div id="warns"></div>
    <div id="hud"></div>
    <div id="drc"></div>
  </div>
</div>
<script>
"use strict";
//============================================================ geometry
// LTspice transform convention, measured empirically (see parse_asc.py).
const ROT = {
  R0:(x,y)=>[x,y],   R90:(x,y)=>[-y,x],  R180:(x,y)=>[-x,-y], R270:(x,y)=>[y,-x],
  M0:(x,y)=>[-x,y],  M90:(x,y)=>[y,x],   M180:(x,y)=>[x,-y],  M270:(x,y)=>[-y,-x],
};
const SNAP = 8;                  // SpiceGlass emits on an 8-unit grid
                                 // (1 mm = 8 LTspice units); the drag/place
                                 // snap MUST match it, or parts land 8u off
                                 // the wires/pins and can never be aligned.
const snap = v => Math.round(v/SNAP)*SNAP;

//============================================================ .asc parser
// Line-oriented: every entity is a contiguous line range. The AST is a
// derived index over the text lines (text is the source of truth).
function parseAsc(text){
  const lines = text.split(/\r?\n/);
  const a = { w:880, h:680, wires:[], flags:[], insts:[], texts:[], lines };
  let pend = null;
  for(let i=0;i<lines.length;i++){
    const t = lines[i].trim().split(/\s+/);
    if(!t[0]) continue;
    const h = t[0].toUpperCase();
    try{
      if(h==="SHEET" && t.length>=4){ a.w=+t[2]; a.h=+t[3]; }
      else if(h==="WIRE" && t.length>=5){
        a.wires.push({x1:+t[1],y1:+t[2],x2:+t[3],y2:+t[4],line:i}); }
      else if(h==="FLAG" && t.length>=4){
        a.flags.push({x:+t[1],y:+t[2],name:t[3],line:i}); }
      else if(h==="SYMBOL" && t.length>=5){
        pend = {sym:t[1].replace(/\\\\/g,"\\"),x:+t[2],y:+t[3],
                rot:t[4].toUpperCase(),attrs:{},line:i,endLine:i,
                attrLines:{}};
        a.insts.push(pend); }
      else if(h==="SYMATTR" && t.length>=3 && pend){
        pend.attrs[t[1]] = t.slice(2).join(" ");
        pend.attrLines[t[1]] = i; pend.endLine=i; }
      else if(h==="TEXT" && t.length>=5){
        const m = lines[i].match(/TEXT\s+(-?\d+)\s+(-?\d+)\s+\S+\s+\S+\s+(.*)/);
        if(m) a.texts.push({x:+m[1],y:+m[2],
                            txt:m[3].replace(/^[!;]+/,""),line:i}); }
    }catch(e){ /* tolerate malformed lines */ }
  }
  return a;
}

//============================================================ display list
// Flat world-space primitives + a uniform-grid spatial index for culling
// and hit-testing. Built once per parse; the camera never touches it.
const CELL = 256;
function buildScene(ast, symlib){
  const P = [];                       // primitives
  const push = (p)=>{ P.push(p); };
  // wires
  ast.wires.forEach((w,wi)=>{
    push({t:"seg",x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,
          bx:Math.min(w.x1,w.x2),by:Math.min(w.y1,w.y2),
          ex:Math.max(w.x1,w.x2),ey:Math.max(w.y1,w.y2),own:"w"+wi});
  });
  // connection analysis (dots emitted at the end, once pins are known)
  const deg={}, vmap={}, hmap={}, ends=[], pinPts=[], nodePts=[];
  const key=(x,y)=>x+","+y;
  for(const w of ast.wires){
    deg[key(w.x1,w.y1)]=(deg[key(w.x1,w.y1)]||0)+1;
    deg[key(w.x2,w.y2)]=(deg[key(w.x2,w.y2)]||0)+1;
    ends.push([w.x1,w.y1],[w.x2,w.y2]);
    if(w.x1===w.x2)(vmap[w.x1]=vmap[w.x1]||[]).push([Math.min(w.y1,w.y2),Math.max(w.y1,w.y2)]);
    else if(w.y1===w.y2)(hmap[w.y1]=hmap[w.y1]||[]).push([Math.min(w.x1,w.x2),Math.max(w.x1,w.x2)]);
  }
  // flags: gnd symbol, or a named-node probe (a ring marking the node point)
  ast.flags.forEach((f,fi)=>{
    const own="f"+fi;
    if(f.name==="0"){
      push({t:"gnd",x:f.x,y:f.y,bx:f.x-12,by:f.y,ex:f.x+12,ey:f.y+14,own});
    }else{
      const power=/^(vdd|vcc|vee|vss|vbat|vpwr|vgnd|v\+|v-|avdd|dvdd)/i
                    .test(f.name);
      push({t:"node",x:f.x,y:f.y,power,bx:f.x-9,by:f.y-12,ex:f.x+9,ey:f.y+9,own});
      push({t:"label",x:f.x+11,y:f.y-6,text:f.name,cls:"flag",
            bx:f.x+11,by:f.y-18,ex:f.x+11+9*f.name.length,ey:f.y,own});
      nodePts.push([f.x,f.y]);
    }
  });
  // symbols
  ast.insts.forEach((d,si)=>{
    const rot = ROT[d.rot]||ROT.R0;
    const tf = (x,y)=>{ const [a,b]=rot(x,y); return [a+d.x,b+d.y]; };
    const sym = symlib[d.sym];
    let bx=d.x-24,by=d.y-24,ex=d.x+24,ey=d.y+24;   // default placeholder box
    const own="s"+si;
    const grow=(x,y)=>{ bx=Math.min(bx,x);by=Math.min(by,y);ex=Math.max(ex,x);ey=Math.max(ey,y); };
    if(sym){
      bx=by=1e9; ex=ey=-1e9;
      for(const [a,b,c,e] of sym.lines){
        const [x1,y1]=tf(a,b),[x2,y2]=tf(c,e);
        grow(x1,y1);grow(x2,y2);
        push({t:"seg",x1,y1,x2,y2,bx:Math.min(x1,x2),by:Math.min(y1,y2),
              ex:Math.max(x1,x2),ey:Math.max(y1,y2),own});
      }
      for(const [a,b,c,e] of sym.rects){
        const [x1,y1]=tf(a,b),[x2,y2]=tf(c,e);
        const rx=Math.min(x1,x2),ry=Math.min(y1,y2),
              rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);
        grow(rx,ry);grow(rx+rw,ry+rh);
        push({t:"rect",x:rx,y:ry,w:rw,h:rh,bx:rx,by:ry,ex:rx+rw,ey:ry+rh,own});
      }
      for(const [a,b,c,e] of sym.circles){
        const [x1,y1]=tf(a,b),[x2,y2]=tf(c,e);
        const cx=(x1+x2)/2,cy=(y1+y2)/2,
              rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;
        grow(cx-rx,cy-ry);grow(cx+rx,cy+ry);
        push({t:"ell",cx,cy,rx,ry,bx:cx-rx,by:cy-ry,ex:cx+rx,ey:cy+ry,own});
      }
      for(const ar of (sym.arcs||[])){
        const [a,b,c,e,xs,ys,xe,ye]=ar;
        const [X1,Y1]=tf(a,b),[X2,Y2]=tf(c,e),
              [XS,YS]=tf(xs,ys),[XE,YE]=tf(xe,ye);
        const cx=(X1+X2)/2,cy=(Y1+Y2)/2,
              rx=Math.abs(X2-X1)/2,ry=Math.abs(Y2-Y1)/2;
        grow(cx-rx,cy-ry); grow(cx+rx,cy+ry);
        push({t:"arc",cx,cy,rx,ry,xs:XS,ys:YS,xe:XE,ye:YE,
              bx:cx-rx,by:cy-ry,ex:cx+rx,ey:cy+ry,own});
      }
      const isBlk = (d.sym||"").indexOf("sg_blk_")>=0;
      for(const pn of (sym.pins||[])){ const [wx,wy]=tf(pn[0],pn[1]);
        pinPts.push([wx,wy]);
        if(isBlk && pn[2]){                  // pin name inside the block box
          const left = wx < d.x;             // sits inside, clear of the stub
          push({t:"label",cls:"pin",text:pn[2],
                x: left ? wx+14 : wx-14-6*pn[2].length, y: wy+4,
                bx:wx-3,by:wy-8,ex:wx+3,ey:wy+6,own});
        }
      }
      if(bx>ex){ bx=d.x-24;by=d.y-24;ex=d.x+24;ey=d.y+24; }
      d._blk = isBlk;
    }else{
      push({t:"miss",x:d.x-24,y:d.y-24,w:48,h:48,
            bx:d.x-24,by:d.y-24,ex:d.x+24,ey:d.y+24,own});
    }
    d._bbox=[bx,by,ex,ey];
    // instance labels: blocks get name above / model below, CENTERED, so
    // long subckt names don't run into neighbouring blocks
    const nm=d.attrs.InstName, val=d.attrs.Value;
    if(d._blk){
      const cx=(bx+ex)/2;
      if(nm) push({t:"label",x:cx-4.2*nm.length,y:by-7,text:nm,cls:"nm",
                   bx:bx,by:by-18,ex:ex,ey:by-2,own});
      if(val) push({t:"label",x:cx-3.4*val.length,y:ey+15,text:val,cls:"val",
                    bx:bx,by:ey+3,ex:ex,ey:ey+18,own});
    }else{
      if(nm) push({t:"label",x:ex+6,y:by+14,text:nm,cls:"nm",
                   bx:ex+6,by:by,ex:ex+6+9*nm.length,ey:by+16,own});
      if(val) push({t:"label",x:ex+6,y:by+30,text:val,cls:"val",
                    bx:ex+6,by:by+16,ex:ex+6+8*val.length,ey:by+32,own});
    }
  });
  // free text
  ast.texts.forEach((tx,ti)=>{
    push({t:"label",x:tx.x,y:tx.y,text:tx.txt,cls:"val",
          bx:tx.x,by:tx.y-14,ex:tx.x+8*tx.txt.length,ey:tx.y,own:"t"+ti});
  });

  // connector dots: only TRUE junctions (LTspice convention) — 3+ wire
  // ends meeting, or a wire passing through a point. A pin/node counts as
  // one connection, so it dots when >=2 wire ends also land there (pin +
  // 2 wires = a tee) or a wire runs through it; a plain leaf pin->wire
  // connection is NOT dotted. Node-probe rings mark named nets regardless.
  const dotSet=new Set();
  const onInterior=(x,y)=>(vmap[x]||[]).some(([a,b])=>a<y&&y<b)||
                          (hmap[y]||[]).some(([a,b])=>a<x&&x<b);
  const addDot=(x,y)=>{ const k=key(x,y); if(dotSet.has(k))return;
    dotSet.add(k); push({t:"dot",x,y,bx:x-4,by:y-4,ex:x+4,ey:y+4,own:null}); };
  for(const k in deg){ const [x,y]=k.split(",").map(Number);
    if(deg[k]>=3 || (deg[k]>=1 && onInterior(x,y))) addDot(x,y); }
  for(const [x,y] of pinPts)
    if((deg[key(x,y)]||0)>=2 || onInterior(x,y)) addDot(x,y);
  for(const [x,y] of nodePts)
    if((deg[key(x,y)]||0)>=2 || onInterior(x,y)) addDot(x,y);

  // spatial grid
  const grid=new Map();
  const cellKey=(cx,cy)=>cx*73856093 ^ cy*19349663;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const c0=Math.floor(p.bx/CELL),c1=Math.floor(p.ex/CELL),
          r0=Math.floor(p.by/CELL),r1=Math.floor(p.ey/CELL);
    for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){
      const k=cellKey(cx,cy);
      let arr=grid.get(k); if(!arr){arr=[];grid.set(k,arr);} arr.push(i);
    }
  }
  return {P,grid,cellKey,ast,pins:pinPts,ends};
}

//============================================================ camera + render
const cv=document.getElementById("cv"), ctx=cv.getContext("2d",{alpha:false});
let cam={scale:1,tx:0,ty:0}, scene=null, dpr=1;
let cursorW=null, hoverOwner=null;  // schematic-editor crosshair + hover
let hilite=null, hiliteName=null, hilitePorts=[], pendingHilite=null; // net hl
let selSet=new Set();               // selected owner ids (multi-select)
let marquee=null;                   // rubber-band rect in world coords
let drag=null;                      // active drag descriptor
const selHas=o=>selSet.has(o);
const selOne=()=>selSet.size===1?[...selSet][0]:null;
let mode="select";                  // "select" | "wire" | "place"
let drawStart=null, drawCur=null;   // wire-draw in progress (world pts)
let placeKind=null, placeOrient="R0", placeCur=null, placeNet=null;  // place mode
let wireDownPt=null, wireJustStarted=false;   // wire press-drag tracking
const W2S=(x,y)=>[x*cam.scale+cam.tx, y*cam.scale+cam.ty];
const S2W=(x,y)=>[(x-cam.tx)/cam.scale, (y-cam.ty)/cam.scale];

// orthogonal segments from a→b (horizontal then vertical); used for both
// the live wire-draw preview and the committed WIRE lines.
function orthoSegs(a,b){
  const [x0,y0]=a,[x1,y1]=b;
  if(x0===x1||y0===y1) return [[x0,y0,x1,y1]];
  return [[x0,y0,x1,y0],[x1,y0,x1,y1]];
}
// snap a world point to the nearest pin / wire endpoint, else to the grid —
// so hand-drawn wires land exactly on connection points.
function nearestSnap(wx,wy){
  const tol=10/cam.scale; let best=null, bd=tol;
  if(scene){
    for(const [x,y] of scene.pins){ const d=Math.hypot(wx-x,wy-y);
      if(d<bd){bd=d;best=[x,y];} }
    for(const [x,y] of scene.ends){ const d=Math.hypot(wx-x,wy-y);
      if(d<bd){bd=d;best=[x,y];} }
  }
  return best||[snap(wx),snap(wy)];
}

function resize(){
  dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr));
  cv.height=Math.max(1,Math.round(r.height*dpr));
  render();
}
function cssSize(){ const r=cv.getBoundingClientRect(); return [r.width,r.height]; }

function fit(){
  if(!scene||!scene.P.length) return;
  let bx=1e9,by=1e9,ex=-1e9,ey=-1e9;
  for(const p of scene.P){bx=Math.min(bx,p.bx);by=Math.min(by,p.by);
                          ex=Math.max(ex,p.ex);ey=Math.max(ey,p.ey);}
  const [W,H]=cssSize(), m=40;
  const s=Math.min((W-2*m)/Math.max(1,ex-bx),(H-2*m)/Math.max(1,ey-by));
  cam.scale=Math.min(s,4);
  cam.tx=W/2-(bx+ex)/2*cam.scale;
  cam.ty=H/2-(by+ey)/2*cam.scale;
  render();
}

let rafPending=false;
function render(){
  if(rafPending) return; rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; draw(); });
}

function draw(){
  const [W,H]=cssSize();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  if(!scene){ return; }
  // world->device matrix (pan/zoom + HiDPI). Only thing that changes per frame.
  ctx.setTransform(cam.scale*dpr,0,0,cam.scale*dpr,cam.tx*dpr,cam.ty*dpr);

  // visible world rect (+margin) for culling
  const [wl,wt]=S2W(0,0), [wr,wb]=S2W(W,H);
  const vl=wl-CELL,vt=wt-CELL,vr=wr+CELL,vb=wb+CELL;
  const lw=1.6/cam.scale;

  // schematic grid: minor 1mm dots, major 5mm dots (level-of-detail)
  function gridDots(step, color, r){
    if(step*cam.scale < 7) return;                 // too dense → skip
    const x0=Math.ceil(wl/step)*step, y0=Math.ceil(wt/step)*step;
    const nx=Math.floor((wr-x0)/step)+1, ny=Math.floor((wb-y0)/step)+1;
    if(nx*ny > 12000 || nx<0 || ny<0) return;      // safety cap
    ctx.fillStyle=color;
    for(let x=x0;x<=wr;x+=step) for(let y=y0;y<=wb;y+=step)
      ctx.fillRect(x-r,y-r,2*r,2*r);
  }
  const px=1/cam.scale;
  gridDots(SNAP,   "#e9edf3", 0.55*px);             // minor (1 mm)
  gridDots(SNAP*5, "#cdd4de", 1.05*px);             // major (5 mm)
  const fsize=13;                                 // world units, LOD below
  const showText=fsize*cam.scale>6.5;

  // cull: gather unique visible primitive indices via the grid
  const vis=[]; const seen=draw._seen||(draw._seen=new Int32Array(0));
  if(seen.length<scene.P.length) draw._seen=new Int32Array(scene.P.length);
  const S=draw._seen; const fid=(draw._fid=(draw._fid||0)+1);
  const c0=Math.floor(vl/CELL),c1=Math.floor(vr/CELL),
        r0=Math.floor(vt/CELL),r1=Math.floor(vb/CELL);
  for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){
    const arr=scene.grid.get(scene.cellKey(cx,cy)); if(!arr)continue;
    for(const i of arr){ if(S[i]===fid)continue; S[i]=fid; vis.push(i); }
  }

  // pass 1: all strokes (wires + symbol bodies + rects) batched in one path
  ctx.strokeStyle="#1b1b1b"; ctx.lineWidth=lw;
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.beginPath();
  for(const i of vis){
    const p=scene.P[i];
    if(p.t==="seg"){ ctx.moveTo(p.x1,p.y1); ctx.lineTo(p.x2,p.y2); }
    else if(p.t==="rect"){ ctx.rect(p.x,p.y,p.w,p.h); }
  }
  ctx.stroke();
  // dashed placeholder boxes for missing symbols
  ctx.save(); ctx.setLineDash([5/cam.scale,4/cam.scale]);
  ctx.beginPath();
  for(const i of vis){ const p=scene.P[i]; if(p.t==="miss") ctx.rect(p.x,p.y,p.w,p.h); }
  ctx.stroke(); ctx.restore();
  // ellipses + arcs
  ctx.beginPath();
  for(const i of vis){ const p=scene.P[i];
    if(p.t==="ell"){ ctx.moveTo(p.cx+p.rx,p.cy);
      ctx.ellipse(p.cx,p.cy,p.rx,p.ry,0,0,Math.PI*2); }
    else if(p.t==="arc" && p.rx>=0.5 && p.ry>=0.5){
      const ts=Math.atan2((p.ys-p.cy)/p.ry,(p.xs-p.cx)/p.rx);
      let te=Math.atan2((p.ye-p.cy)/p.ry,(p.xe-p.cx)/p.rx);
      let sw=te-ts; while(sw<=0) sw+=2*Math.PI;
      ctx.moveTo(p.cx+p.rx*Math.cos(ts), p.cy+p.ry*Math.sin(ts));
      ctx.ellipse(p.cx,p.cy,p.rx,p.ry,0,ts,ts+sw,false); } }
  ctx.stroke();

  // pass 2: junction dots + ground symbols (filled)
  ctx.fillStyle="#1b1b1b";
  const dotR=Math.max(3.2,2.6/cam.scale);   // ~world-fixed, never sub-pixel
  for(const i of vis){ const p=scene.P[i];
    if(p.t==="dot"){ ctx.beginPath();
      ctx.arc(p.x,p.y,dotR,0,Math.PI*2); ctx.fill(); } }
  for(const i of vis){ const p=scene.P[i];
    if(p.t==="gnd"){
      ctx.beginPath(); ctx.moveTo(p.x-10,p.y+2); ctx.lineTo(p.x+10,p.y+2);
      ctx.lineTo(p.x,p.y+12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle="#1b1b1b"; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y+2); ctx.stroke(); } }

  // node probes: a ring marking the actual node point of a named net,
  // plus a small bar for power rails (vdd/vcc/…) — the node, not just text.
  ctx.strokeStyle="#0b4ea2"; ctx.lineWidth=1.7/cam.scale;
  ctx.fillStyle="#0b4ea2";
  for(const i of vis){ const p=scene.P[i]; if(p.t!=="node")continue;
    ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,Math.PI*2); ctx.fill();
    if(p.power){
      ctx.beginPath(); ctx.moveTo(p.x,p.y-4.5); ctx.lineTo(p.x,p.y-10);
      ctx.moveTo(p.x-7,p.y-10); ctx.lineTo(p.x+7,p.y-10); ctx.stroke();
    }
  }

  // pass 3: text (LOD-gated)
  if(showText){
    ctx.textBaseline="alphabetic";
    for(const i of vis){ const p=scene.P[i]; if(p.t!=="label")continue;
      if(p.cls==="flag"){ ctx.fillStyle="#0b4ea2"; ctx.font="600 "+fsize+"px Segoe UI,Arial"; }
      else if(p.cls==="nm"){ ctx.fillStyle="#222"; ctx.font="600 "+fsize+"px Segoe UI,Arial"; }
      else if(p.cls==="pin"){ ctx.fillStyle="#7a8aa0"; ctx.font=(fsize-4)+"px Segoe UI,Arial"; }
      else { ctx.fillStyle="#666"; ctx.font=(fsize-1)+"px Segoe UI,Arial"; }
      ctx.fillText(p.text,p.x,p.y);
    }
  }

  // net highlight: bold colour on the whole electrical net (wires + flags
  // + the block pins it reaches), same level and after following hierarchy
  if(hilite || hiliteName!==null){
    ctx.save(); ctx.strokeStyle="#e8821e"; ctx.fillStyle="#e8821e";
    ctx.lineCap="round"; ctx.lineWidth=3/cam.scale; ctx.beginPath();
    for(const s of (hilite||[])){ ctx.moveTo(s[0],s[1]); ctx.lineTo(s[2],s[3]); }
    ctx.stroke();
    if(hiliteName!==null){ ctx.lineWidth=2/cam.scale;
      for(const f of scene.ast.flags){ if(f.name!==hiliteName)continue;
        ctx.beginPath(); ctx.arc(f.x,f.y,6/cam.scale,0,Math.PI*2); ctx.stroke(); } }
    if(hilitePorts.length){
      const byName={}; scene.ast.insts.forEach(d=>{
        if(d.attrs.InstName) byName[d.attrs.InstName]=d; });
      for(const [inm,pn] of hilitePorts){ const d=byName[inm]; if(!d)continue;
        const sym=symlib[d.sym]; if(!sym)continue; const rot=ROT[d.rot]||ROT.R0;
        for(const p of (sym.pins||[])){ if(p[2]!==pn)continue;
          const [a,b]=rot(p[0],p[1]);
          ctx.beginPath(); ctx.arc(a+d.x,b+d.y,4.5/cam.scale,0,Math.PI*2);
          ctx.fill(); } }
    }
    ctx.restore();
  }

  // hover highlight: faint outline of the symbol under the cursor
  if(hoverOwner && hoverOwner[0]==="s" && !selSet.has(hoverOwner)){
    const d=scene.ast.insts[+hoverOwner.slice(1)];
    if(d&&d._bbox){ const [bx,by,ex,ey]=d._bbox;
      ctx.save(); ctx.strokeStyle="rgba(61,122,214,0.45)";
      ctx.lineWidth=1.4/cam.scale;
      ctx.strokeRect(bx-3,by-3,ex-bx+6,ey-by+6); ctx.restore(); }
  }

  // overlay: selection highlight (world coords, accent) — every selected item
  if(selSet.size){
    ctx.setLineDash([]); ctx.strokeStyle="#3d7ad6"; ctx.lineWidth=2/cam.scale;
    const single=selSet.size===1;
    for(const own of selSet){
      if(own[0]==="w"){
        const w=scene.ast.wires[+own.slice(1)]; if(!w)continue;
        ctx.beginPath(); ctx.moveTo(w.x1,w.y1); ctx.lineTo(w.x2,w.y2); ctx.stroke();
        if(single){ const hs=4.5/cam.scale; ctx.fillStyle="#fff";   // endpoint handles
          for(const [hx,hy] of [[w.x1,w.y1],[w.x2,w.y2]]){
            ctx.fillRect(hx-hs,hy-hs,2*hs,2*hs);
            ctx.strokeRect(hx-hs,hy-hs,2*hs,2*hs); } }
      }else if(own[0]==="s"){
        const d=scene.ast.insts[+own.slice(1)];
        if(d&&d._bbox){ const [bx,by,ex,ey]=d._bbox;
          ctx.strokeRect(bx-3,by-3,ex-bx+6,ey-by+6); }
      }else if(own[0]==="f"){
        const f=scene.ast.flags[+own.slice(1)];
        if(f) ctx.strokeRect(f.x-9,f.y-12,18,21);
      }else if(own[0]==="t"){
        const t=scene.ast.texts[+own.slice(1)];
        if(t) ctx.strokeRect(t.x-2,t.y-14,8*t.txt.length+4,18);
      }
    }
  }
  // rubber-band marquee
  if(marquee){
    const x=Math.min(marquee.x0,marquee.x1), y=Math.min(marquee.y0,marquee.y1),
          w=Math.abs(marquee.x1-marquee.x0), h=Math.abs(marquee.y1-marquee.y0);
    ctx.setLineDash([4/cam.scale,3/cam.scale]); ctx.strokeStyle="#3d7ad6";
    ctx.lineWidth=1/cam.scale; ctx.fillStyle="rgba(61,122,214,0.08)";
    ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
  }

  // wire-draw preview (orthogonal, dashed) + start marker
  if(mode==="wire" && drawStart && drawCur){
    ctx.setLineDash([6/cam.scale,4/cam.scale]);
    ctx.strokeStyle="#3d7ad6"; ctx.lineWidth=1.7/cam.scale; ctx.beginPath();
    for(const [a,b,c,d2] of orthoSegs(drawStart,drawCur)){
      ctx.moveTo(a,b); ctx.lineTo(c,d2); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#3d7ad6"; ctx.beginPath();
    ctx.arc(drawStart[0],drawStart[1],4/cam.scale,0,Math.PI*2); ctx.fill();
  }

  // place-mode ghost (component following the cursor, R rotates)
  if(mode==="place" && placeCur){
    const [px,py]=placeCur;
    ctx.save(); ctx.globalAlpha=0.65; ctx.strokeStyle="#3d7ad6";
    ctx.fillStyle="#3d7ad6"; ctx.lineWidth=1.7/cam.scale;
    if(placeKind==="gnd"){
      ctx.beginPath(); ctx.moveTo(px-10,py+2); ctx.lineTo(px+10,py+2);
      ctx.lineTo(px,py+12); ctx.closePath(); ctx.fill();
    }else if(placeKind==="label"){
      ctx.beginPath(); ctx.arc(px,py,4.5,0,Math.PI*2); ctx.stroke();
    }else{
      const sym=symlib[placeKind], rot=ROT[placeOrient]||ROT.R0;
      if(sym){
        ctx.beginPath();
        for(const [a,b,c,d] of sym.lines){ const [x1,y1]=rot(a,b),[x2,y2]=rot(c,d);
          ctx.moveTo(px+x1,py+y1); ctx.lineTo(px+x2,py+y2); }
        ctx.stroke();
        for(const [a,b,c,d] of (sym.circles||[])){ const [x1,y1]=rot(a,b),[x2,y2]=rot(c,d);
          const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;
          ctx.beginPath(); ctx.ellipse(px+cx,py+cy,rx,ry,0,0,Math.PI*2); ctx.stroke(); }
      }else{ ctx.strokeRect(px-24,py-24,48,48); }
    }
    ctx.fillStyle="#3d7ad6"; ctx.beginPath();
    ctx.arc(px,py,3/cam.scale,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // DRC markers: red rings at flagged problem points
  if(drcMarks.length){
    ctx.save(); ctx.strokeStyle="#d83a3a"; ctx.lineWidth=2.5/cam.scale;
    for(const [x,y] of drcMarks){
      ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }

  // crosshair at the snapped cursor (where a click/place would land)
  if(cursorW && !drag && mode!=="place" && mode!=="wire"){
    const [sx,sy]=cursorW;
    ctx.save();
    ctx.strokeStyle="rgba(61,122,214,0.28)"; ctx.lineWidth=1/cam.scale;
    ctx.setLineDash([5/cam.scale,4/cam.scale]); ctx.beginPath();
    ctx.moveTo(vl,sy); ctx.lineTo(vr,sy);
    ctx.moveTo(sx,vt); ctx.lineTo(sx,vb); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle="#3d7ad6"; ctx.lineWidth=1.3/cam.scale;
    const m=3.5/cam.scale; ctx.strokeRect(sx-m,sy-m,2*m,2*m);
    ctx.restore();
  }
  updateHud();
}

function updateHud(){
  const el=document.getElementById("hud"); if(!el) return;
  let s="";
  if(hiliteName) s+=`net ${hiliteName}   `;
  if(cursorW) s+=`x ${(cursorW[0]/8).toFixed(1)}  y ${(cursorW[1]/8).toFixed(1)} mm   `;
  s+=`zoom ${Math.round(cam.scale*100)}%   grid 1 mm`;
  el.textContent=s;
}

//============================================================ hit-testing
function hitOwner(wx,wy){
  const tol=6/cam.scale;
  let best=null, bestArea=1e18;
  const consider=(own,bx,by,ex,ey)=>{
    if(wx>=bx-tol&&wx<=ex+tol&&wy>=by-tol&&wy<=ey+tol){
      const a=(ex-bx)*(ey-by); if(a<bestArea){bestArea=a;best=own;} }
  };
  // symbols: clickable anywhere inside the WHOLE instance box, not just on
  // its lines — smallest enclosing symbol wins (a part over a big block)
  scene.ast.insts.forEach((d,si)=>{ if(d._bbox) consider("s"+si,...d._bbox); });
  // flags + free text: their own primitive bbox (from the cell grid)
  const cx=Math.floor(wx/CELL),cy=Math.floor(wy/CELL);
  const cand=new Set();
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    const arr=scene.grid.get(scene.cellKey(cx+dx,cy+dy)); if(!arr)continue;
    for(const i of arr) cand.add(i);
  }
  for(const i of cand){ const p=scene.P[i];
    if(p.own&&(p.own[0]==="f"||p.own[0]==="t"))
      consider(p.own,p.bx,p.by,p.ex,p.ey); }
  if(best) return best;
  // else wires: nearest segment within tolerance
  for(const i of cand){ const p=scene.P[i]; if(p.t!=="seg"||!p.own||p.own[0]!=="w")continue;
    if(distSeg(wx,wy,p.x1,p.y1,p.x2,p.y2)<=tol) return p.own; }
  return null;
}
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1, l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  const cx=x1+t*dx,cy=y1+t*dy; return Math.hypot(px-cx,py-cy);
}

//============================================================ text <-> graphics
const ta=document.getElementById("ta");
let raw="", symlib={}, dirty=false, origin=null;
const lineStarts=(text)=>{ const s=[0]; for(let i=0;i<text.length;i++)
  if(text[i]==="\n")s.push(i+1); return s; };

async function reparse(){
  const ast=parseAsc(raw);
  // fetch any symbol geometry we don't have yet
  const need=[...new Set(ast.insts.map(d=>d.sym))].filter(n=>!(n in symlib));
  if(need.length){
    try{
      const r=await fetch("/api/symlib",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({names:need})});
      Object.assign(symlib, await r.json());
    }catch(e){ for(const n of need) symlib[n]=symlib[n]||null; }
  }
  scene=buildScene(ast,symlib);
  if(drcMarks.length){ drcMarks=[]; closeDRC(); }   // geometry changed; stale
  showWarnings(ast);
  render();
}
function showWarnings(ast){
  const box=document.getElementById("warns"); box.innerHTML="";
  const miss=[...new Set(ast.insts.filter(d=>!symlib[d.sym]).map(d=>d.sym))];
  if(miss.length){ const d=document.createElement("div");
    d.textContent="symbol not found: "+miss.join(", ")+" (dashed box)";
    box.appendChild(d); }
}

let reparseTimer=null, typingTimer=null;
ta.addEventListener("input",()=>{
  if(!typingTimer) pushUndo(raw);           // snapshot pre-burst text once
  clearTimeout(typingTimer); typingTimer=setTimeout(()=>{typingTimer=null;},700);
  raw=ta.value; markDirty();
  clearTimeout(reparseTimer);
  reparseTimer=setTimeout(reparse,120);     // debounce text -> graphics
});
// text caret -> highlight matching symbol on canvas
ta.addEventListener("keyup",syncFromCaret);
ta.addEventListener("click",syncFromCaret);
function syncFromCaret(){
  if(!scene) return;
  const pos=ta.selectionStart, ls=lineStarts(raw);
  let ln=0; for(let i=0;i<ls.length;i++){ if(ls[i]<=pos)ln=i; else break; }
  const d=scene.ast.insts.find(d=>ln>=d.line&&ln<=d.endLine);
  if(d){ const idx=scene.ast.insts.indexOf(d); selectOwner("s"+idx,false); }
}

// ---- undo / redo: one unified history of .asc text snapshots, capturing
// graphical edits AND typing (programmatic value-sets wipe the textarea's
// native history, so we own it). pushUndo() records the pre-change state.
let undoStack=[], redoStack=[];
function pushUndo(state){ undoStack.push(state);
  if(undoStack.length>100) undoStack.shift(); redoStack=[]; }
function applyRaw(s){ raw=s; selSet.clear(); origin="graphics"; ta.value=raw;
  origin=null; markDirty(); reparse(); }
function undo(){ if(!undoStack.length)return; redoStack.push(raw);
  applyRaw(undoStack.pop()); }
function redo(){ if(!redoStack.length)return; undoStack.push(raw);
  applyRaw(redoStack.pop()); }

// ---- orientation algebra (LTspice R0..R270 / M0..M270)
function rotCW(rot){ const m=rot[0]==="M", n=(parseInt(rot.slice(1),10)||0);
  return (m?"M":"R")+((n+90)%360); }
function mirror(rot){ const m=rot[0]==="M", n=(parseInt(rot.slice(1),10)||0);
  return (m?"R":"M")+n; }
function rotateSel(fn){            // rotate/mirror every selected symbol at once
  const syms=[...selSet].filter(o=>o[0]==="s");
  if(!syms.length) return;
  const lines=raw.split("\n");
  for(const o of syms){ const d=scene.ast.insts[+o.slice(1)];
    const m=lines[d.line].match(/^(\s*SYMBOL\s+\S+\s+-?\d+\s+-?\d+\s+)(\S+)(.*)$/);
    if(m) lines[d.line]=m[1]+fn(d.rot)+m[3]; }
  commitText(lines.join("\n"));
}
// move every selected entity by the same grid-snapped delta, in one undo step
function startGroupDrag(wx,wy){
  const items=[];
  for(const o of selSet){
    if(o[0]==="s"){ const d=scene.ast.insts[+o.slice(1)]; items.push({o,ox:d.x,oy:d.y}); }
    else if(o[0]==="f"){ const f=scene.ast.flags[+o.slice(1)]; items.push({o,ox:f.x,oy:f.y}); }
    else if(o[0]==="t"){ const t=scene.ast.texts[+o.slice(1)]; items.push({o,ox:t.x,oy:t.y}); }
    else if(o[0]==="w"){ const w=scene.ast.wires[+o.slice(1)];
      items.push({o,ox1:w.x1,oy1:w.y1,ox2:w.x2,oy2:w.y2}); }
  }
  return {kind:"group", items, wx, wy};
}
function commitGroup(){
  const lines=raw.split("\n");
  for(const o of selSet){
    if(o[0]==="s"){ const d=scene.ast.insts[+o.slice(1)];
      const m=lines[d.line].match(/^(\s*SYMBOL\s+\S+\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/);
      if(m) lines[d.line]=m[1]+d.x+m[3]+d.y+m[5]; }
    else if(o[0]==="w"){ const w=scene.ast.wires[+o.slice(1)];
      const m=lines[w.line].match(/^(\s*WIRE\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)\s*$/);
      if(m) lines[w.line]=m[1]+w.x1+m[3]+w.y1+m[5]+w.x2+m[7]+w.y2; }
    else if(o[0]==="f"){ const f=scene.ast.flags[+o.slice(1)];
      const m=lines[f.line].match(/^(\s*FLAG\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/);
      if(m) lines[f.line]=m[1]+f.x+m[3]+f.y+m[5]; }
    else if(o[0]==="t"){ const t=scene.ast.texts[+o.slice(1)];
      const m=lines[t.line].match(/^(\s*TEXT\s+)(-?\d+)(\s+)(-?\d+)(\s+.*)$/);
      if(m) lines[t.line]=m[1]+t.x+m[3]+t.y+m[5]; }
  }
  commitText(lines.join("\n"));
}
function finalizeMarquee(){
  if(!marquee||!scene) return;
  const x0=Math.min(marquee.x0,marquee.x1), x1=Math.max(marquee.x0,marquee.x1),
        y0=Math.min(marquee.y0,marquee.y1), y1=Math.max(marquee.y0,marquee.y1);
  const hit=(bx,by,ex,ey)=>!(ex<x0||bx>x1||ey<y0||by>y1);
  scene.ast.insts.forEach((d,i)=>{ const b=d._bbox;
    if(b&&hit(b[0],b[1],b[2],b[3])) selSet.add("s"+i); });
  scene.ast.wires.forEach((w,i)=>{ if(hit(Math.min(w.x1,w.x2),Math.min(w.y1,w.y2),
    Math.max(w.x1,w.x2),Math.max(w.y1,w.y2))) selSet.add("w"+i); });
  scene.ast.flags.forEach((f,i)=>{ if(hit(f.x-2,f.y-2,f.x+2,f.y+2)) selSet.add("f"+i); });
  scene.ast.texts.forEach((t,i)=>{ if(hit(t.x-2,t.y-14,t.x+2,t.y)) selSet.add("t"+i); });
}
// rotate/mirror whichever symbol is active: the placement ghost, else
// the current selection.
function applyOrient(fn){
  if(mode==="place"){ placeOrient=fn(placeOrient); render(); }
  else rotateSel(fn);
}

// ---- placement: insert new SYMBOL / FLAG lines by clicking
const _PFX={res:"R",cap:"C",ind:"L",diode:"D",nmos:"M",pmos:"M",npn:"Q",
            pnp:"Q",voltage:"V",current:"I",opamp:"U"};
function instNames(){ return scene.ast.insts.map(d=>d.attrs.InstName||""); }
function autoName(name, names){
  names=names||instNames();
  const base=name.split("\\").pop().toLowerCase(), p=_PFX[base]||"X";
  let mx=0; const re=new RegExp("^"+p+"(\\d+)$");
  for(const nm of names){ const m=(nm||"").match(re); if(m) mx=Math.max(mx,+m[1]); }
  return p+(mx+1);
}
function enterPlace(value){
  if(value==="label"){ const net=prompt("Net name (e.g. VDD, OUT):");
    if(!net){ setMode("select"); return; } placeNet=net.trim(); placeKind="label"; }
  else { placeKind=value; placeNet=null; }
  placeOrient="R0";
  if(placeKind!=="gnd" && placeKind!=="label" && !(placeKind in symlib)){
    fetch("/api/symlib?names="+encodeURIComponent(placeKind))
      .then(r=>r.json()).then(d=>{ Object.assign(symlib,d); render(); })
      .catch(()=>{});
  }
  setMode("place");
  palette.blur(); cv.focus();      // so Space/R/keys go to the canvas, not the menu
}
function placeAt(pt){
  const [x,y]=pt;
  if(placeKind==="gnd") addLines([`FLAG ${x} ${y} 0`]);
  else if(placeKind==="label") addLines([`FLAG ${x} ${y} ${placeNet}`]);
  else addLines([`SYMBOL ${placeKind} ${x} ${y} ${placeOrient}`,
                 `SYMATTR InstName ${autoName(placeKind)}`]);
}

// graphics -> text: replace exactly the changed line(s), keep everything else
function patchLine(idx, newText){
  pushUndo(raw);
  const ls=lineStarts(raw);
  const start=ls[idx], end=(idx+1<ls.length?ls[idx+1]-1:raw.length);
  raw=raw.slice(0,start)+newText+raw.slice(end);
  const top=ta.scrollTop, ss=ta.selectionStart, se=ta.selectionEnd;
  origin="graphics"; ta.value=raw; origin=null;
  ta.scrollTop=top;
  try{ ta.setSelectionRange(ss,se); }catch(e){}
  markDirty();
}
function setSymbolPos(si,x,y){
  const d=scene.ast.insts[si];
  const t=raw.split(/\r?\n/)[d.line].match(/^(\s*SYMBOL\s+\S+\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/);
  if(!t) return;
  patchLine(d.line, t[1]+x+t[3]+y+t[5]);
}
function setWireEnds(wi,x1,y1,x2,y2){
  const w=scene.ast.wires[wi];
  const t=raw.split(/\r?\n/)[w.line].match(/^(\s*WIRE\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)\s*$/);
  if(!t) return;
  patchLine(w.line, t[1]+x1+t[3]+y1+t[5]+x2+t[7]+y2);
}
function setFlagPos(fi,x,y){
  const f=scene.ast.flags[fi];
  const t=raw.split(/\r?\n/)[f.line].match(/^(\s*FLAG\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/);
  if(!t) return;
  patchLine(f.line, t[1]+x+t[3]+y+t[5]);
}
function setSymbolOrient(si,rot){
  const d=scene.ast.insts[si];
  const t=raw.split(/\r?\n/)[d.line]
    .match(/^(\s*SYMBOL\s+\S+\s+-?\d+\s+-?\d+\s+)(\S+)(.*)$/);
  if(!t) return;
  patchLine(d.line, t[1]+rot+t[3]);
}
// structural edits (add/remove lines): full re-parse from the text, which
// stays the source of truth. Origin-tagged so the textarea listener no-ops.
function commitText(newRaw){
  pushUndo(raw);
  raw=newRaw; origin="graphics"; ta.value=raw; origin=null;
  markDirty(); reparse();
}
function addLines(arr){
  commitText(raw + (raw.endsWith("\n")?"":"\n") + arr.join("\n") + "\n");
}
function addWires(segs){
  const add=segs.filter(([a,b,c,d])=>a!==c||b!==d)
    .map(([a,b,c,d])=>`WIRE ${a} ${b} ${c} ${d}`);
  if(add.length) addLines(add);
}
function ownerRange(o){           // [firstLine,lastLine] of an entity
  if(o[0]==="w") return [scene.ast.wires[+o.slice(1)].line, scene.ast.wires[+o.slice(1)].line];
  if(o[0]==="f") return [scene.ast.flags[+o.slice(1)].line, scene.ast.flags[+o.slice(1)].line];
  if(o[0]==="t") return [scene.ast.texts[+o.slice(1)].line, scene.ast.texts[+o.slice(1)].line];
  const d=scene.ast.insts[+o.slice(1)]; return [d.line, d.endLine];
}
function deleteSel(){
  if(!selSet.size||!scene) return;
  const ranges=[...selSet].map(ownerRange).sort((a,b)=>b[0]-a[0]); // bottom-up
  const lines=raw.split("\n");
  for(const [a,b] of ranges) lines.splice(a,b-a+1);
  selSet.clear(); commitText(lines.join("\n"));
}

// ---- copy / paste / duplicate (symbols, flags, wires — whole selection)
let clip=null;
function copySel(){
  if(!selSet.size||!scene) return;
  const L=raw.split("\n"), blocks=[];
  for(const o of selSet){
    if(o[0]==="s"){ const d=scene.ast.insts[+o.slice(1)];
      blocks.push({k:"s", lines:L.slice(d.line,d.endLine+1)}); }
    else if(o[0]==="f"){ blocks.push({k:"f", lines:[L[scene.ast.flags[+o.slice(1)].line]]}); }
    else if(o[0]==="w"){ blocks.push({k:"w", lines:[L[scene.ast.wires[+o.slice(1)].line]]}); }
  }
  clip=blocks; setStatus(`copied ${blocks.length}`,false);
}
function offsetLine(L,dx,dy){       // shift the coords of a SYMBOL/FLAG/WIRE line
  let m;
  if(m=L.match(/^(\s*SYMBOL\s+\S+\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/))
    return m[1]+(+m[2]+dx)+m[3]+(+m[4]+dy)+m[5];
  if(m=L.match(/^(\s*FLAG\s+)(-?\d+)(\s+)(-?\d+)(\s+\S+.*)$/))
    return m[1]+(+m[2]+dx)+m[3]+(+m[4]+dy)+m[5];
  if(m=L.match(/^(\s*WIRE\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)(\s+)(-?\d+)\s*$/))
    return m[1]+(+m[2]+dx)+m[3]+(+m[4]+dy)+m[5]+(+m[6]+dx)+m[7]+(+m[8]+dy);
  return L;
}
function pasteClip(dx=SNAP*2, dy=SNAP*2){
  if(!clip||!clip.length) return;
  const names=instNames(), out=[];
  for(const b of clip){
    const block=b.lines.map(L=>offsetLine(L,dx,dy));
    if(b.k==="s"){
      const sl=block.find(L=>/^\s*SYMBOL\s/.test(L));
      const nm=sl && sl.match(/^\s*SYMBOL\s+(\S+)/);
      if(nm){ const nn=autoName(nm[1],names); names.push(nn); let done=false;
        for(let i=0;i<block.length;i++){
          if(/^\s*SYMATTR\s+InstName\s/.test(block[i])){
            block[i]=block[i].replace(/(SYMATTR\s+InstName\s+).*/,"$1"+nn);
            done=true; break; } }
        if(!done) block.push(`SYMATTR InstName ${nn}`); }
    }
    out.push(...block);
  }
  addLines(out);
}

// ---- double-click to edit a symbol's name/value, or rename a net
function editSymbol(si){
  const d=scene.ast.insts[si];
  const nm=prompt("Instance name:", d.attrs.InstName||autoName(d.sym));
  if(nm===null) return;
  const val=prompt("Value / model (blank = none):", d.attrs.Value||"");
  if(val===null) return;
  const lines=raw.split("\n");
  const block=lines.slice(d.line,d.endLine+1).filter(L=>{
    const t=L.trim().split(/\s+/);
    return !(t[0]==="SYMATTR" && (t[1]==="InstName"||t[1]==="Value")); });
  if(nm.trim()) block.push(`SYMATTR InstName ${nm.trim()}`);
  if(val.trim()) block.push(`SYMATTR Value ${val.trim()}`);
  lines.splice(d.line, d.endLine-d.line+1, ...block);
  commitText(lines.join("\n"));
}
function editFlag(fi){
  const f=scene.ast.flags[fi];
  const nv=prompt("Net name (0 = ground):", f.name);
  if(nv===null || !nv.trim()) return;
  const nn=nv.trim();
  const same=scene.ast.flags.filter(g=>g.name===f.name);
  const targets=(same.length>1 &&
      confirm(`Rename all ${same.length} "${f.name}" labels to "${nn}"?`+
              `\n(Cancel = just this one)`)) ? same : [f];
  const lines=raw.split("\n");
  for(const g of targets){
    const m=lines[g.line].match(/^(\s*FLAG\s+-?\d+\s+-?\d+\s+)(\S+)(.*)$/);
    if(m) lines[g.line]=m[1]+nn+m[3];
  }
  commitText(lines.join("\n"));
}

function toggleSel(own){
  if(selSet.has(own)) selSet.delete(own); else selSet.add(own);
  render();
}
function selectOwner(own,scrollText){
  selSet.clear(); if(own) selSet.add(own); render();
  if(scrollText && own){
    let ln=-1, len=0;
    if(own[0]==="s"){ const d=scene.ast.insts[+own.slice(1)]; ln=d.line;
      len=d.endLine-d.line; }
    else if(own[0]==="w"){ ln=scene.ast.wires[+own.slice(1)].line; }
    else if(own[0]==="f"){ ln=scene.ast.flags[+own.slice(1)].line; }
    else if(own[0]==="t"){ ln=scene.ast.texts[+own.slice(1)].line; }
    if(ln>=0){ const ls=lineStarts(raw);
      const a=ls[ln], b=(ln+len+1<ls.length?ls[ln+len+1]-1:raw.length);
      ta.focus(); ta.setSelectionRange(a,b);
      // scroll the line into view
      const lh=parseFloat(getComputedStyle(ta).lineHeight)||18;
      ta.scrollTop=Math.max(0,(ln-3)*lh);
    }
  }
}

//============================================================ pointer input
let ptr=null;
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const [wx,wy]=S2W(mx,my);
  // place mode: drop a new component where you click (chains until Esc)
  if(mode==="place"){ placeAt(nearestSnap(wx,wy)); return; }
  // wire mode: press-drag draws one segment, or click-click chains vertices
  if(mode==="wire"){
    const pt=nearestSnap(wx,wy);
    if(!drawStart){ drawStart=pt; drawCur=pt; wireDownPt=[mx,my]; wireJustStarted=true; }
    else { addWires(orthoSegs(drawStart,pt)); drawStart=pt; drawCur=pt; wireJustStarted=false; }
    render(); return;
  }
  const own = scene?hitOwner(wx,wy):null;
  ptr={x:e.clientX,y:e.clientY,wx,wy,moved:false};
  // Ctrl/Cmd + click = toggle net highlight (and nothing else — so plain
  // clicks, double-clicks, wheel-clicks never disturb the highlight)
  if(scene && (e.ctrlKey||e.metaKey) && e.button===0){
    toggleHiliteAt(wx,wy); drag=null; ptr=null; return; }
  // Shift = multi-select: toggle an item, or rubber-band over empty space
  if(e.shiftKey){
    if(own){ toggleSel(own); drag=null; ptr=null; return; }
    marquee={x0:wx,y0:wy,x1:wx,y1:wy}; drag={kind:"marquee"}; return;
  }
  // grab a selected wire's endpoint handle? (only when a single wire is selected)
  const sw=selOne();
  if(sw && sw[0]==="w"){
    const w=scene.ast.wires[+sw.slice(1)];
    if(w){ const [a1,b1]=W2S(w.x1,w.y1), [a2,b2]=W2S(w.x2,w.y2);
      if(Math.hypot(mx-a1,my-b1)<=9){
        drag={kind:"wend",wi:+sw.slice(1),end:1,ox:w.x1,oy:w.y1,wx,wy};
        cv.style.cursor="grabbing"; return; }
      if(Math.hypot(mx-a2,my-b2)<=9){
        drag={kind:"wend",wi:+sw.slice(1),end:2,ox:w.x2,oy:w.y2,wx,wy};
        cv.style.cursor="grabbing"; return; } }
  }
  if(own){
    if(!selHas(own)) selectOwner(own,true);    // click outside selection -> single
    drag=startGroupDrag(wx,wy);                 // move the whole selection together
    cv.style.cursor="grabbing";
  }else{
    selectOwner(null,false);
    drag={kind:"pan",tx:cam.tx,ty:cam.ty,sx:e.clientX,sy:e.clientY};
  }
});
cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect();
  const [wx,wy]=S2W(e.clientX-r.left,e.clientY-r.top);
  if(mode==="place"){ placeCur=nearestSnap(wx,wy); render(); return; }
  if(mode==="wire"){ drawCur=nearestSnap(wx,wy); if(drawStart) render(); return; }
  if(!drag){ if(scene){ cursorW=nearestSnap(wx,wy); hoverOwner=hitOwner(wx,wy);
      cv.style.cursor=hoverOwner?"grab":"crosshair"; render(); } return; }
  ptr.moved=true;
  if(drag.kind==="pan"){
    cam.tx=drag.tx+(e.clientX-drag.sx); cam.ty=drag.ty+(e.clientY-drag.sy);
    render(); return;
  }
  if(drag.kind==="marquee"){ marquee.x1=wx; marquee.y1=wy; render(); return; }
  const dx=snap(wx-drag.wx), dy=snap(wy-drag.wy);
  if(drag.kind==="group"){
    for(const it of drag.items){
      if(it.o[0]==="s"){ const d=scene.ast.insts[+it.o.slice(1)];
        d.x=it.ox+dx; d.y=it.oy+dy; }
      else if(it.o[0]==="f"){ const f=scene.ast.flags[+it.o.slice(1)];
        f.x=it.ox+dx; f.y=it.oy+dy; }
      else if(it.o[0]==="t"){ const t=scene.ast.texts[+it.o.slice(1)];
        t.x=it.ox+dx; t.y=it.oy+dy; }
      else if(it.o[0]==="w"){ const w=scene.ast.wires[+it.o.slice(1)];
        w.x1=it.ox1+dx; w.y1=it.oy1+dy; w.x2=it.ox2+dx; w.y2=it.oy2+dy; }
    }
    rebuildLive();
  }else if(drag.kind==="wend"){
    const w=scene.ast.wires[drag.wi];
    if(drag.end===1){ w.x1=drag.ox+dx; w.y1=drag.oy+dy; }
    else { w.x2=drag.ox+dx; w.y2=drag.oy+dy; }
    rebuildLive();
  }
});
cv.addEventListener("pointerup",e=>{
  cv.releasePointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  // wire mode: if the press was dragged, commit that segment and finish;
  // a plain click leaves drawStart set for click-click chaining.
  if(mode==="wire"){
    if(drawStart && wireJustStarted && wireDownPt &&
       Math.hypot(mx-wireDownPt[0],my-wireDownPt[1])>6){
      const [wx,wy]=S2W(mx,my), pt=nearestSnap(wx,wy);
      addWires(orthoSegs(drawStart,pt)); drawStart=null; drawCur=null;
    }
    wireJustStarted=false; cv.style.cursor="crosshair"; render(); return;
  }
  cv.style.cursor = mode==="place" ? "crosshair" : "default";
  if(drag){
    if(drag.kind==="marquee"){ finalizeMarquee(); marquee=null; render(); }
    else if(drag.kind==="group" && ptr && ptr.moved){ commitGroup(); }
    else if(drag.kind==="wend" && ptr && ptr.moved){
      const w=scene.ast.wires[drag.wi]; setWireEnds(drag.wi,w.x1,w.y1,w.x2,w.y2); }
  }
  drag=null; ptr=null;
});
// double-click: end a wire chain, or edit the entity under the cursor
cv.addEventListener("dblclick",e=>{
  if(mode==="wire"){ drawStart=null; render(); return; }
  if(mode!=="select"||!scene) return;
  const r=cv.getBoundingClientRect();
  const [wx,wy]=S2W(e.clientX-r.left,e.clientY-r.top);
  const own=hitOwner(wx,wy);
  if(own&&own[0]==="s"){
    const inst=scene.ast.insts[+own.slice(1)];
    if(inst && inst.sym && inst.sym.indexOf("sg_blk_")>=0){   // a block box
      descendBlock(inst.attrs.Value || inst.sym.split("sg_blk_")[1],
                   inst.attrs.InstName);
      return;
    }
    editSymbol(+own.slice(1));
  }
  else if(own&&own[0]==="f") editFlag(+own.slice(1));
});
cv.addEventListener("pointerleave",()=>{ cursorW=null; hoverOwner=null; render(); });
cv.addEventListener("contextmenu",e=>{ if(mode==="wire"){
  e.preventDefault(); drawStart=null; render(); } });
// live rebuild during drag (cheap: same scene rebuild, culled draw)
function rebuildLive(){ scene=buildScene(scene.ast,symlib); render(); }

//============================================================ DRC checks
// Electrical-rule checks computed from the sheet geometry: a pin/wire is
// connected if its point coincides with a wire end, a wire's interior, a
// flag, or another pin (abutment).
let drcMarks=[];
function drcCheck(){
  if(!scene) return [];
  const ast=scene.ast, K=(x,y)=>x+","+y, issues=[];
  const endDeg={}, vmap={}, hmap={};
  for(const w of ast.wires){
    endDeg[K(w.x1,w.y1)]=(endDeg[K(w.x1,w.y1)]||0)+1;
    endDeg[K(w.x2,w.y2)]=(endDeg[K(w.x2,w.y2)]||0)+1;
    if(w.x1===w.x2)(vmap[w.x1]=vmap[w.x1]||[]).push([Math.min(w.y1,w.y2),Math.max(w.y1,w.y2)]);
    else if(w.y1===w.y2)(hmap[w.y1]=hmap[w.y1]||[]).push([Math.min(w.x1,w.x2),Math.max(w.x1,w.x2)]);
  }
  const onInt=(x,y)=>(vmap[x]||[]).some(([a,b])=>a<y&&y<b)||
                     (hmap[y]||[]).some(([a,b])=>a<x&&x<b);
  const flagAt=new Set(ast.flags.map(f=>K(f.x,f.y)));
  const pinAt={}, pins=[];
  ast.insts.forEach((d,si)=>{ const sym=symlib[d.sym]; if(!sym)return;
    const rot=ROT[d.rot]||ROT.R0;
    for(const pn of (sym.pins||[])){ const [px,py]=rot(pn[0],pn[1]);
      const x=px+d.x, y=py+d.y; pins.push({si,x,y}); pinAt[K(x,y)]=(pinAt[K(x,y)]||0)+1; } });
  const connected=(x,y,k)=>(endDeg[k]||0)>=1 || onInt(x,y) || flagAt.has(k);
  for(const p of pins){ const k=K(p.x,p.y);
    if(!(connected(p.x,p.y,k) || (pinAt[k]||0)>=2))
      issues.push({x:p.x,y:p.y,own:"s"+p.si,
        text:`<b>floating pin</b> — ${ast.insts[p.si].attrs.InstName||"?"}`}); }
  const seenEnd=new Set();
  for(const w of ast.wires) for(const [x,y] of [[w.x1,w.y1],[w.x2,w.y2]]){ const k=K(x,y);
    if((endDeg[k]||0)>=2 || onInt(x,y) || flagAt.has(k) || (pinAt[k]||0)>=1) continue;
    if(seenEnd.has(k)) continue; seenEnd.add(k);
    issues.push({x,y,text:"<b>dangling wire</b> — end connects to nothing"}); }
  const nameSeen={}; ast.insts.forEach((d,si)=>{ const n=d.attrs.InstName; if(!n)return;
    if(n in nameSeen) issues.push({x:d.x,y:d.y,own:"s"+si,text:`<b>duplicate name</b> — ${n}`});
    else nameSeen[n]=1; });
  const posSeen={}; ast.insts.forEach((d,si)=>{ const k=K(d.x,d.y);
    if(k in posSeen) issues.push({x:d.x,y:d.y,own:"s"+si,text:"<b>overlap</b> — two symbols here"});
    else posSeen[k]=1; });
  return issues;
}
function runDRC(){
  const issues=drcCheck(); drcMarks=issues.map(i=>[i.x,i.y]);
  const box=document.getElementById("drc"); box.style.display="block";
  let html=`<div class="hd">DRC — ${issues.length} issue`+
    `${issues.length===1?"":"s"}<span class="x" id="drcx">✕</span></div>`;
  html += issues.length
    ? issues.map((i,n)=>`<div class="it" data-n="${n}">${i.text}</div>`).join("")
    : `<div class="ok">✓ no problems found</div>`;
  box.innerHTML=html;
  box.querySelector("#drcx").onclick=closeDRC;
  box.querySelectorAll(".it").forEach(el=>el.onclick=()=>{
    const i=issues[+el.dataset.n]; focusAt(i.x,i.y);
    if(i.own) selectOwner(i.own,false); });
  render();
  setStatus(issues.length?`${issues.length} DRC issue(s)`:"DRC clean ✓",
            issues.length>0);
}
function closeDRC(){ drcMarks=[]; const b=document.getElementById("drc");
  b.style.display="none"; b.innerHTML=""; render(); }
function focusAt(x,y){ const [W,H]=cssSize();
  cam.scale=Math.max(cam.scale,1.2);
  cam.tx=W/2-x*cam.scale; cam.ty=H/2-y*cam.scale; render(); }

cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const [wx,wy]=S2W(mx,my);
  const f=Math.exp(-e.deltaY*0.0015);
  cam.scale=Math.max(0.02,Math.min(40,cam.scale*f));
  cam.tx=mx-wx*cam.scale; cam.ty=my-wy*cam.scale;
  render();
},{passive:false});

//============================================================ save / status
function markDirty(){ dirty=true; setStatus("edited ·",true); }
function setStatus(s,warn){ const el=document.getElementById("status");
  el.textContent=s; el.style.color=warn?"#caa23a":"#9fb6a3"; }
async function save(){
  try{
    const r=await fetch("/api/save",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:raw})});
    if(r.ok){ dirty=false; setStatus("saved ✓",false); }
    else setStatus("save failed",true);
  }catch(e){ setStatus("save failed",true); }
}
document.getElementById("save").onclick=save;
document.getElementById("fit").onclick=fit;
const wireBtn=document.getElementById("wirebtn");
const palette=document.getElementById("palette");
function setMode(m){
  mode=m; drawStart=null; drawCur=null;
  if(m!=="place"){ placeKind=null; placeCur=null; placeNet=null;
                   palette.value=""; }
  wireBtn.style.background = m==="wire" ? "#3d7ad6" : "";
  cv.style.cursor = (m==="wire"||m==="place") ? "crosshair" : "default";
  const msg = m==="wire" ? "wire: drag to draw a line (or click-click) · Esc to stop"
            : m==="place" ? "place: click to drop · Space/R rotates · Esc done"
            : (dirty?"edited ·":"ready");
  setStatus(msg, m!=="select");
  render();
}
wireBtn.onclick=()=>setMode(mode==="wire"?"select":"wire");
document.getElementById("delbtn").onclick=deleteSel;
document.getElementById("checkbtn").onclick=runDRC;
document.getElementById("undobtn").onclick=undo;
document.getElementById("redobtn").onclick=redo;
palette.addEventListener("change",()=>{ if(palette.value) enterPlace(palette.value); });
window.addEventListener("keydown",e=>{
  const ctrl=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(ctrl && k==="s"){ e.preventDefault(); save(); return; }
  if(ctrl && k==="z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(ctrl && (k==="y" || (k==="z" && e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(document.activeElement===ta) return;        // typing in the text pane
  if(ctrl && k==="c"){ e.preventDefault(); copySel(); return; }
  if(ctrl && k==="v"){ e.preventDefault(); pasteClip(); return; }
  if(ctrl && k==="d"){ e.preventDefault(); copySel(); pasteClip(); return; }
  if(k===" "){ e.preventDefault(); applyOrient(rotCW); }   // Space = rotate 90°
  else if(k==="w"){ setMode(mode==="wire"?"select":"wire"); }
  else if(k==="r"){ applyOrient(rotCW); }
  else if(k==="m"){ applyOrient(mirror); }
  else if(k==="escape"){ if(mode!=="select") setMode("select");
                         else if(selSet.size) selectOwner(null,false);
                         else if(navStack.length) navBack(); }
  else if(k==="delete"||k==="backspace"){ e.preventDefault(); deleteSel(); }
});

//============================================================ resizable split
(function(){
  const bar=document.getElementById("dragbar"), left=document.getElementById("left");
  let down=false;
  bar.addEventListener("pointerdown",e=>{down=true;bar.setPointerCapture(e.pointerId);});
  bar.addEventListener("pointermove",e=>{ if(!down)return;
    const w=document.getElementById("wrap").getBoundingClientRect();
    const px=Math.max(200,Math.min(w.width-200,e.clientX-w.left));
    left.style.width=px+"px"; resize(); });
  bar.addEventListener("pointerup",e=>{down=false;});
})();

//============================================================ files
const filesSel=document.getElementById("files");
async function loadFileList(current){
  try{
    const d=await (await fetch("/api/files")).json();
    filesSel.innerHTML="<option value=''>— open a file —</option>"+
      (d.files||[]).map(f=>`<option value="${f.replace(/"/g,'&quot;')}"`+
        (f===current?" selected":"")+`>${f}</option>`).join("");
  }catch(e){}
}
filesSel.addEventListener("change",()=>{
  if(filesSel.value) openPath(filesSel.value);
});
async function openPath(path){
  setStatus("opening…",false);
  try{
    const d=await (await fetch("/api/open",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({path})})).json();
    if(d.error){ setStatus(d.error,true); return; }
    applyBootstrap(d);
  }catch(e){ setStatus("open failed",true); }
}
document.getElementById("upload").onclick=()=>document.getElementById("fileinput").click();
document.getElementById("fileinput").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const content=await f.text();
  setStatus("uploading…",false);
  try{
    const d=await (await fetch("/api/upload",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:f.name,content})})).json();
    if(d.error){ setStatus(d.error,true); return; }
    applyBootstrap(d); loadFileList();
  }catch(e){ setStatus("upload failed",true); }
  ev.target.value="";
});

// ---- import KiCad (.kicad_sym) / xschem (.sym) symbol libraries
document.getElementById("importbtn").onclick=()=>
  document.getElementById("libinput").click();
document.getElementById("libinput").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  setStatus("importing "+f.name+"…",false);
  try{
    const content=await f.text();
    const d=await (await fetch("/api/import",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:f.name,content})})).json();
    if(d.error){ setStatus(d.error,true); }
    else { setStatus(`imported ${d.count} symbol(s) — pick from + Component`,false);
           refreshLibrary(); }
  }catch(e){ setStatus("import failed",true); }
  ev.target.value="";
});
async function refreshLibrary(){
  try{
    const d=await (await fetch("/api/library")).json();
    const pal=document.getElementById("palette");
    const old=pal.querySelector("#impgroup"); if(old) old.remove();
    if(d.imported && d.imported.length){
      const g=document.createElement("optgroup"); g.id="impgroup";
      g.label=`Imported (${d.imported.length})`;
      for(const n of d.imported){ const o=document.createElement("option");
        o.value=n; o.textContent=n; g.appendChild(o); }
      pal.appendChild(g);
    }
  }catch(e){}
}

//============================================================ boot
//============================================================ hierarchy nav
let navStack=[];               // ancestor frames {name,file,text,cam,symlib}
let curName=null, curFile=null, _descending=false;

function escHtml(s){ return (s||"").replace(/[&<>]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function updateCrumb(){
  const el=document.getElementById("crumb");
  const names=[...navStack.map(f=>f.name||"?"), curName||"?"];
  if(names.length<=1 || !curName){ el.innerHTML=""; return; }
  el.innerHTML = "&nbsp;"+names.map((n,i)=> i===names.length-1
    ? `<b>${escHtml(n)}</b>`
    : `<a href="#" data-i="${i}">${escHtml(n)}</a>`).join(" › ");
  el.querySelectorAll("a").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); navTo(+a.dataset.i); });
}

async function descendBlock(name,instName){
  if(!name) return;
  // if a highlighted net enters this block, follow it into the child
  const carry = hiliteName && instName
    ? (hilitePorts.find(p=>p[0]===instName)||[])[1] : null;
  const frame={name:curName,file:curFile,text:ta.value,
               cam:{...cam},symlib};
  setStatus("opening "+name+"…",false);
  try{
    const d=await (await fetch("/api/descend",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name})})).json();
    if(d.error){ setStatus(d.error,true); return; }
    navStack.push(frame);
    clearHilite(); pendingHilite=carry;
    _descending=true; applyBootstrap(d); _descending=false;
    updateCrumb();
    if(pendingHilite){ highlightName(pendingHilite); pendingHilite=null; }
  }catch(e){ setStatus("open block failed",true); }
}

function restoreFrame(f){
  clearHilite();
  raw=f.text; origin="graphics"; ta.value=raw; origin=null;
  symlib=f.symlib||symlib; selSet.clear();
  curName=f.name; curFile=f.file;
  scene=buildScene(parseAsc(raw),symlib);
  cam={...f.cam}; showWarnings(scene.ast); render();
  setStatus("ready",false);
}

async function navTo(j){
  if(j>=navStack.length) return;          // already current
  const f=navStack[j];
  navStack=navStack.slice(0,j);           // discard deeper levels
  try{ await fetch("/api/setpath",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({path:f.file})}); }catch(e){}
  restoreFrame(f); updateCrumb();
}
function navBack(){ if(navStack.length) navTo(navStack.length-1); }

//============================================================ net highlight
function setHilite(d){
  if(!d || (!d.segments.length && !d.name && !(d.ports||[]).length)){
    hilite=null; hiliteName=null; hilitePorts=[]; render(); return; }
  hilite=d.segments||[]; hiliteName=d.name||null; hilitePorts=d.ports||[];
  render();
}
let hiliteKey=null;
function clearHilite(){ hilite=null; hiliteName=null; hilitePorts=[];
  hiliteKey=null; pendingHilite=null; }
function _netReq(body,then){
  fetch("/api/net",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({text:ta.value},body))})
    .then(r=>r.json()).then(then).catch(()=>{});
}
function _netKey(d){ return (d.name||"")+"#"+
  (d.segments||[]).map(s=>s.join(",")).sort().join(";"); }
// Ctrl+click: toggle the net under the cursor (same net -> off, empty -> off)
function toggleHiliteAt(wx,wy){
  _netReq({x:Math.round(wx),y:Math.round(wy)}, d=>{
    const empty = !d || (!d.segments.length && !d.name && !(d.ports||[]).length);
    if(empty || _netKey(d)===hiliteKey){ clearHilite(); render(); return; }
    hiliteKey=_netKey(d); setHilite(d);
  });
}
// highlight a net by name (used when following a net into a child block)
function highlightName(name){ _netReq({name}, d=>{ hiliteKey=_netKey(d);
  setHilite(d); }); }

//============================================================ boot
function applyBootstrap(data){
  raw=(data.text||"").replace(/\r\n?/g,"\n");   // normalize so offsets are exact
  ta.value=raw; symlib=data.symbols||{}; selSet.clear();
  curName=data.subckt||null; curFile=data.file||null;
  if(!_descending){ navStack=[]; clearHilite(); updateCrumb(); }
  const note=document.getElementById("srcnote");
  note.textContent = (data.converted && data.source)
    ? `converted from ${data.source} → ${data.file}` : "";
  scene=buildScene(parseAsc(raw),symlib);
  resize(); fit(); showWarnings(scene.ast);
  setStatus(data.file?"ready":"no file — pick one",false);
}
window.addEventListener("resize",resize);
async function boot(){
  const data=await (await fetch("/api/asc")).json();
  applyBootstrap(data);
  loadFileList(data.rel);
  refreshLibrary();
}
boot();
</script>
